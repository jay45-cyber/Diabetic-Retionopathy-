# ==============================================================================
# Configuration: 5-Class Diabetic Retinopathy Severity Grading
# Benchmark Architectures: ViT-B/16, ResNet-50, Swin Transformer
# Dataset Standard: APTOS 2019 Blindness Detection (Grades 0 to 4)
# ==============================================================================

project:
  name: "dr_severity_grading"
  task: "5_class_classification"
  random_seed: 42
  num_classes: 5
  class_names:
    0: "No DR"
    1: "Mild DR"
    2: "Moderate DR"
    3: "Severe DR"
    4: "Proliferative DR"
  referable_threshold: 2  # Grade >= 2 is Referable DR

model:
  # Supported: vit_base_patch16_224, vit_base_patch16_384, resnet50, swin_base_patch4_window7_224, swin_tiny_patch4_window7_224
  model_name: "vit_base_patch16_224"
  pretrained: true
  dropout_rate: 0.2
  num_classes: 5

data:
  dataset_root: "data/raw/aptos2019"
  image_dir: "data/raw/aptos2019/train_images"
  train_csv: "data/processed/splits/dr_train.csv"
  val_csv: "data/processed/splits/dr_val.csv"
  test_csv: "data/processed/splits/dr_test.csv"
  split_ratios:
    train: 0.70
    val: 0.15
    test: 0.15
  image_size: [224, 224]  # Configurable: [224, 224] or [384, 384]
  use_clahe: false
  crop_circle: true
  num_workers: 0

training:
  epochs: 30
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: "adamw"
  lr_scheduler: "cosine_annealing"
  loss_function: "weighted_cross_entropy"
  early_stopping_patience: 5
  primary_metric: "val_macro_f1"
  grad_accum_steps: 1
  max_grad_norm: 1.0
  use_amp: true
  device: "auto"  # "auto", "cuda", or "cpu"

paths:
  checkpoint_dir: "models/checkpoints"
  output_dir: "outputs/dr_experiments"
  metrics_output: "outputs/dr_experiments/metrics"
  explanations_output: "outputs/explanations"
